name: Docs

on:
  pull_request:
    paths:
      - "content/docs/**"
      - "scripts/sync-docs-to-sanity.mjs"
      - "sanity/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs-sync.yml"

permissions:
  contents: read

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontmatter, slugs, icons and MDX
        run: bun scripts/sync-docs-to-sanity.mjs --check
